name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:ci

      - name: TypeScript and Vite build
        run: npm run build

      - name: Coverage policy regression tests
        run: npm run coverage:policy:test

      - name: Release version sync regression tests
        run: npm run version:unit:test

      - name: Release policy regression tests
        run: npm run release:unit:test

      - name: Vitest with coverage
        run: npm run test:coverage

      # Two real Vite builds, so it is a step of its own rather than part of the Vitest gate. It
      # proves the local-media E2E fake is absent from a production bundle and present only when
      # the build sets its flag.
      - name: Local media fake bundle boundary
        run: npm run local-media:fake:check

      - name: Enforce frontend coverage policy
        run: npm run coverage:check:frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest contract checks
        run: npm run contracts:check

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate main specifications
        run: npx --yes @fission-ai/openspec@1.8.0 validate --specs --strict

      - name: Validate active changes
        shell: bash
        run: |
          shopt -s nullglob
          for change_dir in openspec/changes/*/; do
            change_name="$(basename "$change_dir")"
            if [[ "$change_name" == "archive" ]]; then
              continue
            fi
            npx --yes @fission-ai/openspec@1.8.0 validate "$change_name" --strict
          done

  documentation:
    name: Documentation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore documentation tool and Rust caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook.exe
            .docs-target
          # Cargo keeps the lockfile at the workspace root, so src-tauri/Cargo.lock no longer
          # exists. hashFiles() on a missing path yields a constant, which would have turned this
          # into a cache that never invalidates rather than an error.
          key: documentation-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'docs/toolchain.json') }}
          restore-keys: |
            documentation-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install pinned mdBook
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content docs/toolchain.json | ConvertFrom-Json).mdbook
          $installedVersion = if (Get-Command mdbook -ErrorAction SilentlyContinue) {
            mdbook --version
          } else {
            ""
          }
          if ($installedVersion -notmatch [regex]::Escape($expectedVersion)) {
            cargo install mdbook --version $expectedVersion --locked --force
          }

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check documentation sources
        run: |
          npm run docs:check
          npm run docs:test

      - name: Verify documentation screenshots
        run: npm run docs:screenshots:check

      - name: Upload documentation screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-screenshot-failures-${{ github.run_id }}
          path: .docs-screenshots/test-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Build documentation site
        run: npm run docs:build

      - name: Confirm documentation build is read-only
        run: git diff --exit-code

      - name: Upload documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site-${{ github.run_id }}
          path: .docs-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Linux fast linker
        run: |
          clang --version
          mold --version

      - name: Architecture fitness
        run: npm run architecture:check

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Scoped to non-test targets on purpose. unwrap/expect are permitted in tests, and
      # `[lints.clippy]` in Cargo.toml has no target selectivity — setting these lints there
      # would make the --all-targets step above fail on ~9,560 test sites. Reuses this job's
      # build cache, so the marginal cost is analysing two targets rather than a rebuild.
      - name: Rust production panic shortcuts
        run: npm run native:panic:check

      - name: Rust tests
        run: cargo test --workspace

      # The local-media bridge is the only Python in the product and has no build step that would
      # catch a syntax error. Standard library only, so it needs no install of its own; the runner
      # reports NOT RUN rather than passing if the image ever ships without an interpreter.
      - name: Local media Python bridge tests
        run: npm run local-media:python:test

  native-coverage:
    name: Native Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Verify Linux fast linker
        run: |
          clang --version
          mold --version

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate native coverage
        run: npm run coverage:native

      - name: Enforce native coverage policy
        run: npm run coverage:check:native

      - name: Upload native coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage-${{ github.run_id }}
          path: coverage/native/
          if-no-files-found: warn
          retention-days: 14

  native-platform-check:
    name: Native Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify Windows LLD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustLld = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if (-not (Test-Path -LiteralPath $rustLld)) {
            throw "Rust toolchain LLD was not found at $rustLld"
          }
          Write-Output "Using Rust toolchain LLD at $rustLld"

      - name: Native cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Windows Skill Tool hostile fixtures (declarative-only)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml skill_tool --lib

      - name: Windows Skill Tool hostile fixtures (module runtime)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features skill-tool-module-runtime skill_tool --lib

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      # A separate instrumented dev server, so the suite above keeps asserting truthful
      # native-only behaviour against an un-instrumented one.
      - name: Run local media fake-driven E2E tests
        run: npm run local-media:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop-smoke:
    name: Desktop Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop automation boundaries
        run: npm run desktop:unit:test

      - name: Run native desktop smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      - name: Run native desktop smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Upload desktop smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: test-results/desktop/
          if-no-files-found: warn
          retention-days: 14

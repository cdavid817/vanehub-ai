name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:ci

      - name: TypeScript and Vite build
        run: npm run build

      - name: Coverage policy regression tests
        run: npm run coverage:policy:test

      - name: Release version sync regression tests
        run: npm run version:unit:test

      - name: Release policy regression tests
        run: npm run release:unit:test

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Enforce frontend coverage policy
        run: npm run coverage:check:frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: coverage/frontend/
          if-no-files-found: warn
          retention-days: 14

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest contract checks
        run: npm run contracts:check

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate main specifications
        run: npx --yes @fission-ai/openspec@1.8.0 validate --specs --strict

      - name: Validate active changes
        shell: bash
        run: |
          shopt -s nullglob
          for change_dir in openspec/changes/*/; do
            change_name="$(basename "$change_dir")"
            if [[ "$change_name" == "archive" ]]; then
              continue
            fi
            npx --yes @fission-ai/openspec@1.8.0 validate "$change_name" --strict
          done

  documentation:
    name: Documentation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore documentation tool and Rust caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook.exe
            .docs-target
          # Cargo keeps the lockfile at the workspace root, so src-tauri/Cargo.lock no longer
          # exists. hashFiles() on a missing path yields a constant, which would have turned this
          # into a cache that never invalidates rather than an error.
          key: documentation-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'docs/toolchain.json') }}
          restore-keys: |
            documentation-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install pinned mdBook
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content docs/toolchain.json | ConvertFrom-Json).mdbook
          $installedVersion = if (Get-Command mdbook -ErrorAction SilentlyContinue) {
            mdbook --version
          } else {
            ""
          }
          if ($installedVersion -notmatch [regex]::Escape($expectedVersion)) {
            cargo install mdbook --version $expectedVersion --locked --force
          }

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check documentation sources
        run: |
          npm run docs:check
          npm run docs:test

      - name: Verify documentation screenshots
        run: npm run docs:screenshots:check

      - name: Upload documentation screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-screenshot-failures-${{ github.run_id }}
          path: .docs-screenshots/test-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Build documentation site
        run: npm run docs:build

      - name: Confirm documentation build is read-only
        run: git diff --exit-code

      - name: Upload documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-site-${{ github.run_id }}
          path: .docs-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Linux fast linker
        run: |
          clang --version
          mold --version

      - name: Architecture fitness
        run: npm run architecture:check

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Scoped to non-test targets on purpose. unwrap/expect are permitted in tests, and
      # `[lints.clippy]` in Cargo.toml has no target selectivity — setting these lints there
      # would make the --all-targets step above fail on ~9,560 test sites. Reuses this job's
      # build cache, so the marginal cost is analysing two targets rather than a rebuild.
      - name: Rust production panic shortcuts
        run: npm run native:panic:check

      - name: Rust tests
        run: cargo test --workspace

  native-coverage:
    name: Native Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Verify Linux fast linker
        run: |
          clang --version
          mold --version

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate native coverage
        run: npm run coverage:native

      - name: Enforce native coverage policy
        run: npm run coverage:check:native

      - name: Upload native coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage-${{ github.run_id }}
          path: coverage/native/
          if-no-files-found: warn
          retention-days: 14

  native-platform-check:
    name: Native Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Raised from 45 to 75 for the macOS workspace test run below, and then to 180 because 75 was
    # not enough: the concurrency suite finished but `cargo test --workspace` was still compiling
    # test targets when the clock ran out, and a cancelled step reports as a failure that looks
    # like a test result. The cache below should keep the usual run far under this; the ceiling is
    # for a cold one.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # A handful of integration tests spawn `node`. Pinned rather than relying on whatever
      # the runner image ships, so a runner image bump cannot change what these tests execute.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # This job now builds the tree *and* its test targets, twice over on macOS. Without a cache
      # that is a cold Tauri dependency compile every run, which is what pushed the previous
      # attempt past its timeout. Same action and same shape as the documentation job's cache, so
      # there is one caching convention here rather than two.
      - name: Restore Rust caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-platform-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-platform-${{ runner.os }}-

      - name: Verify Windows LLD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustLld = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if (-not (Test-Path -LiteralPath $rustLld)) {
            throw "Rust toolchain LLD was not found at $rustLld"
          }
          Write-Output "Using Rust toolchain LLD at $rustLld"

      - name: Native cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Which lock a transaction takes, and whether SQLite will wait for it, is decided by the
      # VFS layer -- and that layer is a different implementation on every OS. A passing
      # snapshot-isolation result therefore says nothing about the platforms it did not run on.
      # Named as its own step so each platform's result is readable from the job list rather
      # than only from inside the full test log.
      - name: SQLite transaction concurrency suite
        run: >-
          cargo test --workspace --lib --
          platform::database::tests::
          a_reader_sees_one_whole_generation_while_a_writer_commits_the_next

      # Scoped to macOS on purpose, and the scope is the whole point of the comment: Linux
      # already runs this in the `rust` job above, and Windows runs the two fixture steps
      # below alongside local full-suite runs. macOS ran nothing -- it built the tree and
      # reported success without executing a single test. Extending the workspace run to
      # Windows as well is a standing runner-cost decision, not a gap this step is hiding.
      - name: Rust tests
        if: runner.os == 'macOS'
        run: cargo test --workspace

      - name: Windows Skill Tool hostile fixtures (declarative-only)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml skill_tool --lib

      - name: Windows Skill Tool hostile fixtures (module runtime)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features skill-tool-module-runtime skill_tool --lib

  cli-parameter-fixtures:
    name: CLI Parameter Fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Every platform reports independently. A Windows separator rule and a POSIX executable bit
    # fail for unrelated reasons, and stopping the matrix on the first one hides the other.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `.cargo/config.toml` pins clang plus mold for x86_64-unknown-linux-gnu, so a Linux runner
      # without them fails at link time with `invalid linker name in argument '-fuse-ld=mold'`
      # before a single test runs. This is the same list the repository's other Linux cargo jobs
      # install; the workspace lib pulls in Tauri, so the webkit and appindicator development
      # packages are needed to compile it, not only to package it.
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-parameter-fixtures-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cli-parameter-fixtures-${{ runner.os }}-

      # The fixtures write a SQLite file into a temporary directory and read no user configuration,
      # but the runtime's own directory resolution is pinned anyway so a leak into a real profile
      # fails here instead of quietly succeeding.
      #
      # Written through $GITHUB_ENV rather than a job-level `env:` block: the `runner` context is
      # not available at job level, and a workflow that references it there is rejected outright —
      # no jobs run and there is nothing to read but "workflow file issue".
      - name: Pin the isolated fixture directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/vanehub-cli-parameter-fixtures"
          mkdir -p "$root/config" "$root/data"
          {
            echo "VANEHUB_APP_DATA_DIR=$root"
            echo "XDG_CONFIG_HOME=$root/config"
            echo "XDG_DATA_HOME=$root/data"
          } >> "$GITHUB_ENV"

      - name: Mark the deterministic CLI stub executable
        if: runner.os != 'Windows'
        run: chmod +x tests/desktop/fixtures/cli/opencode

      # Path-list normalization, executable status, argv token preservation, and profile
      # persistence with revision and catalog CAS. No provider is launched, no credential is read,
      # and the only executable involved is the repository's own stub, which is inspected rather
      # than run.
      - name: Native CLI parameter fixtures
        run: cargo test --workspace platform_fixture_tests

      - name: Native CLI parameter subdomain
        run: cargo test --workspace cli_parameters

      - name: Install npm dependencies
        run: npm ci

      # The generated frontend catalog has to match the canonical registry on every platform, and
      # the renderer port has to produce the same argv tokens as the native one.
      - name: Frontend CLI parameter contracts
        run: npm run contracts:check

      - name: Report platform status
        if: always()
        shell: bash
        run: echo "CLI parameter fixtures on ${{ matrix.os }} -> ${{ job.status }}"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-parameter-fixtures-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/debug/deps/*.log
            ${{ runner.temp }}/vanehub-cli-parameter-fixtures
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop-smoke:
    name: Desktop Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop automation boundaries
        run: npm run desktop:unit:test

      - name: Run native desktop smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      - name: Run native desktop smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Upload desktop smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: test-results/desktop/
          if-no-files-found: warn
          retention-days: 14

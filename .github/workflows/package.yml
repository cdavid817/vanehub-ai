name: Package Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate synchronized project versions
        run: npm run version:check

      - name: Validate release policy
        run: npm run release:unit:test

      - name: Validate permission hook sidecar configuration
        run: npm run sidecar:unit:test

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: ${{ github.ref_type == 'tag' && 'release' || 'build-preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            npm_script: package:windows:x64
          - platform: macos
            arch: arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            npm_script: package:macos:arm64
          - platform: macos
            arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            npm_script: package:macos:x64
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            npm_script: package:linux:x64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            npm_script: package:linux:arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            mold \
            patchelf \
            wget \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify Linux fast linker
        if: matrix.platform == 'linux'
        run: |
          clang --version
          mold --version

      - name: Verify Windows LLD
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $rustLld = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if (-not (Test-Path -LiteralPath $rustLld)) {
            throw "Rust toolchain LLD was not found at $rustLld"
          }
          Write-Output "Using Rust toolchain LLD at $rustLld"

      - name: Install npm dependencies
        run: npm ci

      - name: Forward provisioned signing credentials
        if: github.ref_type == 'tag'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
        run: |
          # An unset secret expands to an empty string rather than being absent, and the Tauri
          # bundler treats a defined APPLE_CERTIFICATE as a request to sign. Forwarding a blank
          # value fails the macOS build at `security import` instead of producing the unsigned
          # bundle an unprovisioned repository should get, so only non-empty values are exported.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_SIGNER_SUBJECT; do
            value="${!name}"
            if [[ -n "${value}" ]]; then
              printf '%s<<__VANEHUB_ENV__\n%s\n__VANEHUB_ENV__\n' "${name}" "${value}" >> "${GITHUB_ENV}"
            fi
          done

          if [[ -z "${APPLE_CERTIFICATE}" && "${RUNNER_OS}" == "macOS" ]]; then
            echo "No Apple signing credentials configured; producing an unsigned, un-notarized bundle."
          fi

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::tagged releases require the updater signing key" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            if [[ "${RUNNER_OS}" == "Windows" && -z "${WINDOWS_CERTIFICATE}" ]]; then
              echo "::error::stable Windows releases require signing credentials" >&2
              exit 1
            fi
            if [[ "${RUNNER_OS}" == "macOS" && ( -z "${APPLE_CERTIFICATE}" || -z "${APPLE_ID}" || -z "${APPLE_TEAM_ID}" ) ]]; then
              echo "::error::stable macOS releases require signing and notarization credentials" >&2
              exit 1
            fi
          fi

      - name: Generate ephemeral updater key for rehearsal
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          key_path="${RUNNER_TEMP}/vanehub-rehearsal.key"
          npx tauri signer generate --ci --force --write-keys "${key_path}" --password "rehearsal-only"
          echo "TAURI_SIGNING_PRIVATE_KEY=${key_path}" >> "${GITHUB_ENV}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=rehearsal-only" >> "${GITHUB_ENV}"
          echo "Ephemeral updater key generated for this non-publishing job only."

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "vanehub-release.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null

      - name: Build package
        run: npm run ${{ matrix.npm_script }}

      # `target/` here, not `src-tauri/target/`: establish-cargo-workspace-skeleton made src-tauri a
      # workspace member, and Cargo places the target directory at the workspace root regardless of
      # which member's manifest drives the build.
      - name: Sign Windows installer
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $packages = Get-ChildItem "target/${{ matrix.rust_target }}/release/bundle" -Recurse -Filter *.exe
          if ($packages.Count -eq 0) { throw "No Windows installer found" }
          foreach ($package in $packages) {
            & signtool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /n $env:WINDOWS_SIGNER_SUBJECT $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($package.Name)" }
          }

      - name: Verify Windows publisher and timestamp
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $packages = Get-ChildItem "target/${{ matrix.rust_target }}/release/bundle" -Recurse -Filter *.exe
          if ($packages.Count -eq 0) { throw "No Windows installer found" }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature $package.FullName
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($package.Name)" }
            if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_SIGNER_SUBJECT*") { throw "Unexpected publisher: $($signature.SignerCertificate.Subject)" }
            if (-not $signature.TimeStamperCertificate) { throw "Missing trusted timestamp: $($package.Name)" }
            Write-Output "PASSED publisher=$($signature.SignerCertificate.Subject) timestamp=$($signature.TimeStamperCertificate.NotBefore)"
          }

      - name: Verify macOS signature, notarization, and staple
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          app_bundle="$(find "target/${{ matrix.rust_target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_bundle="$(find "target/${{ matrix.rust_target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${app_bundle}" && test -n "${dmg_bundle}"
          codesign --verify --deep --strict --verbose=2 "${app_bundle}"
          xcrun stapler validate "${app_bundle}"
          xcrun stapler validate "${dmg_bundle}"
          spctl --assess --type execute --verbose=2 "${app_bundle}"
          echo "PASSED Developer ID signature and stapled notarization ticket"

      - name: Record unsigned rehearsal status
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            echo "BLOCKED code-signing-not-applicable; integrity verified during publish rehearsal"
          elif [[ "${{ matrix.platform }}" == "windows" && -z "${WINDOWS_CERTIFICATE}" ]]; then
            echo "BLOCKED production signing credentials intentionally unavailable"
          elif [[ "${{ matrix.platform }}" == "macos" && -z "${APPLE_CERTIFICATE}" ]]; then
            echo "BLOCKED production signing/notarization credentials intentionally unavailable"
          else
            echo "PASSED configured signing verification"
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VaneHub-AI-${{ matrix.platform }}-${{ matrix.arch }}
          # Collect distributables by format rather than the whole bundle tree. `bundle/**` also
          # matches the AppImage's unpacked `.AppDir` and the deb build directory (268 extra
          # files in one Linux run), and every one of them would be attached to the release.
          path: |
            target/${{ matrix.rust_target }}/release/bundle/*/*.exe
            target/${{ matrix.rust_target }}/release/bundle/*/*.dmg
            target/${{ matrix.rust_target }}/release/bundle/*/*.deb
            target/${{ matrix.rust_target }}/release/bundle/*/*.AppImage
            target/${{ matrix.rust_target }}/release/bundle/*/*.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - validate
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets/downloads

      - name: Normalize target-qualified asset names
        shell: bash
        run: |
          mkdir -p release-assets/packages
          while IFS= read -r -d '' file; do
            relative="${file#release-assets/downloads/}"
            artifact_dir="${relative%%/*}"
            target="${artifact_dir#VaneHub-AI-}"
            filename="$(basename "${file}")"
            if [[ "${filename}" == *.sig ]]; then
              unsigned="${filename%.sig}"
              extension=".${unsigned##*.}.sig"
              stem="${unsigned%.*}"
            else
              extension=".${filename##*.}"
              stem="${filename%.*}"
            fi
            cp "${file}" "release-assets/packages/${stem}-${target}${extension}"
          done < <(find release-assets/downloads -type f -print0)

          test "$(find release-assets/packages -type f | wc -l)" -gt 0

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/vanehub-ai-sbom.spdx.json
          upload-artifact: false

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          # Name each entry the way GitHub will serve it, not the way it sits on this runner.
          # `sha256sum` writes the path it was given, so the workspace-relative paths this used
          # to emit matched nothing a downloader had on disk, and the documented
          # `sha256sum --check --ignore-missing SHA256SUMS` verified zero files while exiting
          # non-zero. Release assets are served under their basename with spaces replaced by
          # dots, which is what the release notes tell people to check.
          : > release-assets/SHA256SUMS
          while IFS= read -r -d '' file; do
            digest="$(sha256sum "${file}" | cut -d' ' -f1)"
            asset="$(basename "${file}" | tr ' ' '.')"
            printf '%s  %s\n' "${digest}" "${asset}" >> release-assets/SHA256SUMS
          done < <(find release-assets -type f ! -name SHA256SUMS -print0 | sort -z)

          echo "Published checksum manifest:"
          cat release-assets/SHA256SUMS

          # A duplicate basename would make one entry unverifiable and silently shadow another.
          if [ "$(cut -c 67- release-assets/SHA256SUMS | sort | uniq -d | wc -l)" -ne 0 ]; then
            echo "::error::two release assets share a name after GitHub's substitution" >&2
            exit 1
          fi

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/packages/**

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release-assets/packages/**
          sbom-path: release-assets/vanehub-ai-sbom.spdx.json

      - name: Generate signed updater channel metadata
        run: |
          channel_manifest="latest.json"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then channel_manifest="preview.json"; fi
          node scripts/generate-updater-manifest.mjs release-assets/packages "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "release-assets/${channel_manifest}"
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1])); if (!value.version || !value.platforms) process.exit(1)' "release-assets/${channel_manifest}"

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)

          args=(
            --repo "${GITHUB_REPOSITORY}"
            --title "VaneHub AI ${GITHUB_REF_NAME}"
            --generate-notes
            --verify-tag
          )

          # Semantic versioning introduces a pre-release identifier with a hyphen and permits one
          # in no other version component, so the tag alone decides this and there is no separate
          # input a maintainer can forget to set.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Publishing ${GITHUB_REF_NAME} as a pre-release."
            args+=(--prerelease --latest=false --notes-file .github/PREVIEW_RELEASE_NOTES.md)
          else
            echo "Publishing ${GITHUB_REF_NAME} as a stable release."
            args+=(--notes-file .github/STABLE_RELEASE_NOTES.md)
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${args[@]}"

      - name: Publish verified channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          channel="stable"
          manifest="release-assets/latest.json"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            channel="preview"
            manifest="release-assets/preview.json"
          fi

          channel_tag="update-${channel}"
          if ! gh release view "${channel_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${channel_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "VaneHub AI ${channel} update channel" \
              --notes "Machine-readable signed updater metadata. Use versioned releases for downloads and release notes." \
              --prerelease \
              --latest=false
          fi

          # This mutable channel release is updated only after every package, signature,
          # notarization, checksum, SBOM, attestation, and versioned-release step succeeds.
          cp "${manifest}" "${RUNNER_TEMP}/latest.json"
          gh release upload "${channel_tag}" "${RUNNER_TEMP}/latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/frontend
    commit-message:
      prefix: deps(npm)
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    # The workspace root, not `/src-tauri`. `Cargo.lock` moved here when the cargo workspace was
    # established (#180) and `src-tauri/Cargo.toml` now inherits all 78 of its dependencies with
    # `workspace = true`, so there is no version literal in that directory to bump. Pointed at the
    # old path, the updater opened no pull request and reported no error for months — which looks
    # exactly like having no updates to make.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/native
    commit-message:
      prefix: deps(cargo)
    # Tauri/Wry expose WebView2 COM types from 0.38.x. A standalone 0.39.x
    # upgrade introduces incompatible windows-core types at the API boundary.
    ignore:
      - dependency-name: webview2-com
        versions:
          - ">=0.39.0, <0.40.0"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/github
    commit-message:
      prefix: deps(actions)
    groups:
      actions-updates:
        patterns:
          - "*"

name: Bug report
description: Report a reproducible VaneHub AI defect
title: "[Bug]: "
labels:
  - type/bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve VaneHub AI. Remove API keys, tokens, SSH keys, and personal data before submitting — never paste unredacted credentials or logs.
  - type: input
    id: version
    attributes:
      label: VaneHub AI version or commit
      description: Copy the version from Settings → About, or the commit SHA for a source build.
      placeholder: version shown in Settings → About, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      options:
        - x64
        - ARM64 / Apple Silicon
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      options:
        - Release installer (.exe / .dmg / .deb / AppImage)
        - Built from source
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime mode
      description: The Web/mock preview simulates the UI only; most defects need the desktop runtime to reproduce.
      options:
        - Tauri desktop app
        - Web/mock preview (npm run dev)
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent involved (if any)
      description: e.g. OnePiece, Claude Code, Codex CLI, OpenCode, Gemini CLI, Antigravity CLI — plus the CLI version if known.
      placeholder: OnePiece / claude-code 2.x / not agent-related
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Add relevant redacted logs and screenshots. Unified logs live under the log directory shown in Settings → Basic configuration.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed API keys, tokens, SSH keys, credentials, personal data, and other sensitive content from every field above.
          required: true
        - label: This is not a security vulnerability (those go to private vulnerability reporting, never a public issue).
          required: true

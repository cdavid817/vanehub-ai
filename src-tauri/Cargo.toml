[package]
name = "vanehub-ai"
version = "0.1.0-preview.1"
description = "Unified AI coding agent management"
authors = ["vanehub-ai"]
edition = "2021"

[lib]
name = "vanehub_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# Optional WebAssembly runtime for Skill tool modules (`add-sandboxed-skill-tool-runtime`).
# Off by default: declarative Skill tools are fully functional without it. The dependency disables
# Wasmtime's broad defaults and deliberately omits WASI, components, threads, cache, and profiling.
# Discovery, integrity, trust, and governance all work with this off — a `wasm` tool is then
# reported as `module-runtime-unavailable` rather than silently missing from the inventory.
skill-tool-module-runtime = ["dep:wasmtime"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
serde = { workspace = true }
wasmtime = { workspace = true, optional = true }
serde_json = { workspace = true }
lsp-types = { workspace = true }
tempfile = { workspace = true }
tauri = { workspace = true }
tauri-plugin-autostart = { workspace = true }
axum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rmcp = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
tauri-plugin-dialog = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
html5ever = { workspace = true }
russh = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
futures-util = { workspace = true }
keyring = { workspace = true }
prost = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
zip = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }
portable-pty = { workspace = true }
process-wrap = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
json5 = { workspace = true }
dirs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
globset = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }
windows-sys = { workspace = true }
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
proc-macro2 = { workspace = true }
syn = { workspace = true }

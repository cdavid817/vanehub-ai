[package]
name = "vanehub-ai"
version = "0.1.0"
description = "Unified AI coding agent management"
authors = ["vanehub-ai"]
edition = "2021"

[lib]
name = "vanehub_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.0.1", default-features = false, features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
http = "1"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = { version = "=0.32.1", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "metrics", "logs"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["blocking", "json", "socks"] }
russh = { version = "=0.62.5", default-features = false, features = ["ring"] }
async-trait = "0.1"
base64 = "0.23"
futures-util = "0.3"
keyring = "4.1.5"
prost = "0.14"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10"
sha2 = "0.11"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
url = "2"
webpki-roots = "1"
zeroize = "1"
portable-pty = "0.9.0"
process-wrap = { version = "9.1.0", features = ["std", "tokio1"] }
toml = "1.1"
toml_edit = "0.25.12"
json5 = "1.3.1"
dirs = "6"
tracing = { version = "=0.1.44", features = ["attributes", "std"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tauri-plugin-opener = "2"
globset = "0.4"
ignore = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "metrics", "logs", "testing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
